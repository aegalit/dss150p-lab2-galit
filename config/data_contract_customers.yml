    unique: true
  - name: first_name
    type: string
    nullable: false
    unique: false
  - name: last_name
    type: string
    nullable: false
    unique: false
  - name: email
    type: string
    nullable: true
    unique: false
  - name: city
    type: string
    nullable: true
    unique: false
  - name: signup_date
    type: date
    nullable: false
